<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f16">
<title>AniTürk — Anime İzle</title>
<style>
html, body { max-width: 100vw; overflow-x: hidden !important; margin: 0; padding: 0; }
* { box-sizing: border-box; }
:root{
 --bg:#0b0f16;--surface:#121925;--surface2:#192333;--line:#273449;--txt:#e5ebf4;--muted:#9aa9bd;
 --primary:#3b82f6; --shadow:0 14px 40px #02071199
}
body{background:var(--bg);color:var(--txt);font:15px/1.5 Inter,sans-serif;-webkit-font-smoothing:antialiased;}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}

/* === GİRİŞ EKRANI === */
#loginScreen{position:fixed;inset:0;background:#0b0f16;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.login-box h2{text-align:center;margin-top:0;font-size:24px;color:var(--primary)}
.login-box p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
.input-group{margin-bottom:15px}
.input-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.input-group input{width:100%;background:#151e2b;border:1px solid var(--line);border-radius:6px;padding:12px;color:white;outline:none;transition:0.2s}
.input-group input:focus{border-color:var(--primary)}
.pass-strength{height:4px;background:#333;border-radius:2px;margin-top:5px;transition:0.3s;width:0%}
.pass-text{font-size:11px;margin-top:3px;color:var(--muted)}
.btn-login{width:100%;background:var(--primary);color:white;border:0;border-radius:6px;padding:14px;font-weight:bold;font-size:16px;margin-top:10px;transition:0.2s}
.btn-login:hover{background:#2563eb}

/* === ANA UYGULAMA === */
.topbar{height:72px;position:sticky;top:0;z-index:20;background:#0d131d;border-bottom:1px solid var(--line)}
.nav{max-width:1480px;height:100%;margin:auto;padding:0 28px;display:flex;align-items:center;gap:30px}
.brand{display:inline-flex;align-items:center;gap:10px;background:none;color:#d5deeb;font-size:23px;font-weight:850}
.brand-mark{width:31px;height:31px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;color:#eaf2ff;font-size:17px;font-weight:900;background:linear-gradient(145deg,#45658f,#243b5c);border:1px solid #6785ad;}
.navlinks{display:flex;gap:23px}.navlinks a{font-size:13px;color:#aab8ca;font-weight:650}
.navlinks a.active{color:#9bb9e3}.grow{flex:1}
.navsearch{width:min(260px,25vw);border:1px solid var(--line);background:#151e2b;padding:10px 14px;border-radius:11px;color:white;outline:none}

/* === İÇERİK === */
.wrap{max-width:1480px;margin:auto;padding:28px 28px 100px}
.section{margin-top:34px}
.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}
.section-head h2{margin:0;font-size:23px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:190px;gap:15px;overflow-x:auto;padding:2px 2px 12px}
.catalog-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:23px 16px}
.anime-card{min-width:0;cursor:pointer}
.cover{width:100%;height:270px;object-fit:cover;display:block;border-radius:6px;background:#171723;transition:0.2s}
.anime-card:hover .cover{transform:translateY(-3px);filter:brightness(1.1)}
.cover-wrap{position:relative}
.score{position:absolute;top:8px;left:8px;background:#0b1422e8;border:1px solid #344b69;border-radius:4px;padding:4px 7px;font-size:11px;font-weight:850}
.anime-card h3{font-size:14px;line-height:1.3;margin:9px 1px 3px;font-weight:650;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subline{color:#aaa;font-size:11px}

/* === MODAL === */
.modal{position:fixed;inset:0;z-index:50;background:#000c;display:none;place-items:center;padding:16px;backdrop-filter:blur(10px)}
.modal.show{display:grid; animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dialog{width:100%; max-width:850px; max-height:90vh; overflow-y:auto; overflow-x:hidden; border:1px solid #34445b;background:#0f1521;border-radius:12px;position:relative}
.dialog-banner{height:240px;background-size:cover;background-position:center;position:relative}
.dialog-banner:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0f1521,transparent 80%)}
.dialog-inner{padding:0 30px 30px;position:relative;margin-top:-60px}
.dialog-cover{width:130px;height:185px;object-fit:cover;border:3px solid #0f1521;border-radius:8px;float:left;margin-right:20px}
.dialog h2{font-size:28px;margin:0 0 5px;font-weight:800}
.dialog-desc{clear:both;padding-top:25px;color:#cbd5e1;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.chip{background:#1e293b;color:#93c5fd;border-radius:4px;padding:5px 10px;font-size:12px;font-weight:600}
.close{position:absolute;right:16px;top:16px;z-index:3;border:1px solid #ffffff33;background:#090912c9;color:white;border-radius:8px;padding:8px 14px;font-weight:600}

/* === BUTONLAR === */
.detail-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;align-items:center}
.btn-play{background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;border:none;border-radius:8px;padding:14px 28px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 15px rgba(37,99,235,0.4);transition:0.3s;cursor:pointer}
.btn-play:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(37,99,235,0.6)}
.btn-episodes{background:#1e293b;color:#93c5fd;border:1px solid #334155;border-radius:8px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer;transition:0.2s}
.btn-episodes:hover{background:#334155}

/* === BÖLÜM LİSTESİ === */
.episode-list{display:flex;flex-direction:column;gap:10px;margin-top:20px; width: 100%;}
.ep-item{background:#151e2b;border:1px solid #273449;padding:15px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:0.2s}
.ep-item:hover{border-color:var(--primary);background:#1a2538}
.ep-name{font-weight:600;font-size:14px; word-break: break-word;}
.ep-sub{font-size:12px;color:#93c5fd;margin-top:4px;display:flex;gap:10px}

/* === VİDEO OYNATICI === */
#videoPlayerModal .dialog{width:100%; max-width: 1100px; background:#000;border:1px solid #333;overflow:hidden; margin: auto;}
.player-header{display:flex;justify-content:space-between;align-items: center; padding:16px 24px;background:#0f1521;border-bottom:1px solid #1e293b; flex-wrap: wrap; gap: 10px;}
.player-header h3{font-size: 16px; margin:0; word-break: break-word;}
.video-container{position:relative;width:100%;padding-top:56.25%;background:#000}
.video-container video {
  position:absolute;top:0;left:0;width:100%;height:100%;
  outline:none;
  object-fit: contain;
  background: #000;
}
.video-container video:-webkit-full-screen { object-fit: contain; }
.video-container video:fullscreen { object-fit: contain; }

/* === ALT BAR (PROFİL) === */
.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:25;background:#10101cf5;border-top:1px solid var(--line);padding:10px 20px;justify-content:space-between;align-items:center;backdrop-filter:blur(16px)}
.profile-info{display:flex;align-items:center;gap:10px; width: 100%;}
.profile-avatar{width:36px;height:36px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:white;font-weight:bold;font-size:18px; flex-shrink:0;}
.profile-name{font-size:14px;font-weight:600}
.profile-history{font-size:11px;color:var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;}

@media(max-width:1000px){.catalog-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:650px){
 .topbar{height:60px}.nav{padding:0 15px}.brand{font-size:21px}.navlinks{display:none}.navsearch{width:auto;flex:1}
 .wrap{padding:17px 14px 90px}.catalog-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .dialog-inner{padding:0 20px 20px}.dialog h2{font-size:22px}
 .btn-play, .btn-episodes{width:100%;justify-content:center}
 .profile-history{max-width: 150px;}
}
</style>
<!-- HLS.js Kütüphanesi (M3U8 akışları için) -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div id="loginScreen">
  <div class="login-box">
    <h2>AniTürk'e Hoş Geldin</h2>
    <p>İzlemeye başlamak için profilini oluştur.</p>
    <div class="input-group">
      <label>Kullanıcı Adın</label>
      <input type="text" id="regName" placeholder="İsmini yaz...">
    </div>
    <div class="input-group">
      <label>Şifre</label>
      <input type="password" id="regPass" placeholder="Güçlü bir şifre belirle..." oninput="checkStrength()">
      <div class="pass-strength" id="passBar"></div>
      <div class="pass-text" id="passText"></div>
    </div>
    <div class="input-group">
      <label>Şifreyi Onayla</label>
      <input type="password" id="regPassConfirm" placeholder="Şifreni tekrar gir...">
    </div>
    <button class="btn-login" onclick="registerUser()">Kayıt Ol ve Giriş Yap</button>
  </div>
</div>

<!-- ANA UYGULAMA -->
<div id="mainApp" style="display:none;">
  <header class="topbar"><nav class="nav"><a class="brand" href="#"><span class="brand-mark">A</span><span>AniTürk</span></a><div class="navlinks"><a class="active" href="#home">Ana Sayfa</a><a href="#trending">Trendler</a><a href="#catalog">Keşfet</a></div><div class="grow"></div><input class="navsearch" id="topSearch" placeholder="Anime ara..."></nav></header>

  <main class="wrap">
    <section class="section" id="trending"><div class="section-head"><div><h2>Şu an trend</h2><p>Topluluğun konuştukları</p></div></div><div class="rail" id="trendingRail"><div class="loading">Yükleniyor…</div></div></section>
    <section class="section" id="catalog"><div class="section-head"><div><h2>Anime kataloğu</h2><p>Arama yap, yeni seriler bul</p></div></div><div class="catalog-grid" id="catalogGrid"><div class="loading">Yükleniyor…</div></div></section>
  </main>

  <!-- ALT PROFİL BARI -->
  <div class="mobilebar">
    <div class="profile-info">
      <div class="profile-avatar" id="userAvatar">A</div>
      <div style="overflow: hidden; width: 100%;">
        <div class="profile-name" id="userName">Kullanıcı</div>
        <div class="profile-history" id="userHistory">Henüz bir şey izlemedin.</div>
      </div>
    </div>
  </div>
</div>

<!-- DETAY MODALI -->
<div class="modal" id="detailModal" onclick="if(event.target===this)closeModal()">
 <div class="dialog">
  <button class="close" onclick="closeModal()">Kapat ✕</button>
  <div class="dialog-banner" id="dBanner"></div>
  <div class="dialog-inner" id="dInner"></div>
 </div>
</div>

<!-- BÖLÜMLER MODALI -->
<div class="modal" id="episodesModal" onclick="if(event.target===this)closeEpisodes()">
 <div class="dialog" style="width:100%; max-width:600px; padding:20px;">
   <button class="close" onclick="closeEpisodes()">Kapat ✕</button>
   <h2 style="margin-top:0;">Bölümler</h2>
   <div class="episode-list" id="episodeList"></div>
 </div>
</div>

<!-- VİDEO OYNATICI -->
<div class="modal" id="videoPlayerModal" onclick="if(event.target===this)closeVideo()">
 <div class="dialog">
  <div class="player-header">
   <h3 id="vTitle">Anime Adı</h3>
   <button class="close" style="position:static" onclick="closeVideo()">Kapat ✕</button>
  </div>
  <div class="video-container">
   <video id="mainVideo" controls playsinline preload="metadata" crossorigin="anonymous">
    <source src="" type="video/mp4">
   </video>
  </div>
 </div>
</div>

<script>
// === 1. GİRİŞ VE ŞİFRE SİSTEMİ ===
function checkStrength() {
  const pass = document.getElementById('regPass').value;
  const bar = document.getElementById('passBar');
  const text = document.getElementById('passText');
  
  let strength = 0;
  if (pass.length >= 5) strength++;
  if (pass.length >= 8) strength++;
  if (/[A-Z]/.test(pass)) strength++;
  if (/[0-9]/.test(pass)) strength++;
  if (/[^A-Za-z0-9]/.test(pass)) strength++;

  if (pass.length === 0) {
    bar.style.width = '0%'; text.innerText = '';
  } else if (strength <= 2) {
    bar.style.width = '33%'; bar.style.background = '#ef4444'; text.innerText = 'Zayıf (Kabul Edilmez)'; text.style.color = '#ef4444';
  } else if (strength <= 4) {
    bar.style.width = '66%'; bar.style.background = '#eab308'; text.innerText = 'Normal'; text.style.color = '#eab308';
  } else {
    bar.style.width = '100%'; bar.style.background = '#22c55e'; text.innerText = 'Güçlü (Mükemmel)'; text.style.color = '#22c55e';
  }
}

function registerUser() {
  const name = document.getElementById('regName').value.trim();
  const pass = document.getElementById('regPass').value;
  const confirm = document.getElementById('regPassConfirm').value;

  if (name.length < 3) return alert('İsmin en az 3 harf olmalı.');
  if (pass.length < 5 || (pass.length < 8 && !/[0-9]/.test(pass))) {
    return alert('Şifren çok zayıf! Lütfen daha güçlü bir şifre gir (1234 gibi şifreler kabul edilmez).');
  }
  if (pass !== confirm) return alert('Şifreler uyuşmuyor!');

  localStorage.setItem('aniturk_user', JSON.stringify({name: name, pass: pass}));
  localStorage.setItem('aniturk_history', 'Henüz bir şey izlemedin.');
  
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  initApp();
}

window.onload = () => {
  const user = JSON.parse(localStorage.getItem('aniturk_user'));
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    initApp();
  }
};

// === 2. API VE ANİME VERİLERİ ===
const API='https://graphql.anilist.co';
const FIELDS=`id title { romaji english native } coverImage { extraLarge large medium } bannerImage description(asHtml:false) episodes status season seasonYear averageScore genres format`;
const QUERY=`query ($page:Int,$perPage:Int,$sort:[MediaSort],$search:String) { Page(page:$page,perPage:$perPage) { media(type:ANIME,isAdult:false,sort:$sort,search:$search) { ${FIELDS} } } }`;
let detailCache={};

// === GERÇEK ANİME VERİTABANI (HLS DESTEKLİ) ===
// Not: HLS (.m3u8) linkleri, MP4'e göre daha stabildir ve mobilde daha az engellenir.
// Aşağıdaki "url" kısmına kendi bulduğun .m3u8 linklerini yapıştırabilirsin.
const animeDB = {
  "Astro Boy": [
    { name: "1. Bölüm", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", subtitle: "" }
  ],
  "Namakura Gatana": [
    { name: "Tam Film (1917)", url: "https://media.japanesewithanime.com/images/1788/namakura-gatana.mp4", subtitle: "" }
  ],
  "Chainsaw Man": [
    { 
      name: "1. Bölüm: Dog & Chainsaw", 
      // Test için bir HLS akışı. Gerçek bölüm linkini buraya yapıştır.
      url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", 
      // Altyazı dosyası (GitHub'a yüklediğin yolu yaz)
      subtitle: "subtitles/chainsaw_man_01_tr.vtt" 
    }
    // Diğer bölümleri buraya ekleyebilirsin
  ]
};

// AniList'ten gelen başlığı veritabanımızdaki başlıkla eşleştirir
function findAnimeInDB(anilistTitle) {
  const cleanTitle = anilistTitle.toLowerCase().trim();
  for (let key in animeDB) {
    if (cleanTitle.includes(key.toLowerCase())) {
      return animeDB[key];
    }
  }
  return null;
}

function title(a){return a.title?.english||a.title?.romaji||'İsimsiz anime'}
function safeText(s){return String(s||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function api(query,variables={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables})});const j=await r.json();return j.data}
async function getList(sort,perPage=12,search=null){const d=await api(QUERY,{page:1,perPage,sort:[sort],search});return d.Page.media}

function makeCard(a){
 detailCache[a.id]=a;
 return `<article class="anime-card" onclick="openDetail(${a.id})">
  <div class="cover-wrap">
   <img class="cover" loading="lazy" src="${a.coverImage?.large||''}" alt="${esc(title(a))}">
   <span class="score">★ ${a.averageScore? (a.averageScore/10).toFixed(1):'—'}</span>
  </div>
  <h3>${esc(title(a))}</h3>
  <div class="subline">${a.seasonYear||'—'} · ${a.format||'ANIME'}</div>
 </article>`
}

async function initApp(){
  const user = JSON.parse(localStorage.getItem('aniturk_user'));
  document.getElementById('userName').innerText = user.name;
  document.getElementById('userAvatar').innerText = user.name.charAt(0).toUpperCase();
  
  const history = localStorage.getItem('aniturk_history');
  if(history) document.getElementById('userHistory').innerText = "Son izlenen: " + history;

  try{
   const trend = await getList('TRENDING_DESC', 12);
   document.getElementById('trendingRail').innerHTML = trend.map(makeCard).join('');
   const catalog = await getList('POPULARITY_DESC', 24);
   document.getElementById('catalogGrid').innerHTML = catalog.map(makeCard).join('');
  }catch(e){ console.log(e); }
}

// === 3. DETAY VE BÖLÜMLER ===
function openDetail(id){
 const a=detailCache[id];
 const img=a.coverImage?.extraLarge||a.coverImage?.large||'',banner=a.bannerImage||img;
 document.getElementById('dBanner').style.backgroundImage=`linear-gradient(0deg,#0f1521,transparent),url("${banner}")`;
 const animeTitle = title(a);
 
 const episodesData = findAnimeInDB(animeTitle);
 
 let actionButtons = '';
 if (episodesData) {
   actionButtons = `
     <button class="btn-play" onclick="playVideo('${esc(animeTitle)}', 0)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Hemen İzle
     </button>
     <button class="btn-episodes" onclick="openEpisodes('${esc(animeTitle)}')">
        Bölümler (${episodesData.length})
     </button>
   `;
 } else {
   actionButtons = `
     <div style="background:#331a1a; border:1px solid #662222; color:#ff8888; padding:12px 20px; border-radius:8px; font-weight:600; font-size:14px;">
        ⚠️ Bu anime için henüz bölüm eklenmedi.
     </div>
   `;
 }

 document.getElementById('dInner').innerHTML=`
  <img class="dialog-cover" src="${img}">
  <h2>${esc(animeTitle)}</h2>
  <div class="dialog-stats"><span>★ ${a.averageScore?(a.averageScore/10).toFixed(1):'—'}</span><span>${a.seasonYear||'Yıl bilinmiyor'}</span><span>${a.episodes||'?'} bölüm</span></div>
  <div class="chips">${(a.genres||[]).slice(0,4).map(g=>`<span class="chip">${esc(g)}</span>`).join('')}</div>
  <div class="dialog-desc">${safeText(a.description)||'Açıklama yok.'}</div>
  
  <div class="detail-actions">
   ${actionButtons}
  </div>`;
 document.getElementById('detailModal').classList.add('show');
}

function closeModal(){document.getElementById('detailModal').classList.remove('show')}

function openEpisodes(animeTitle){
  const episodesData = findAnimeInDB(animeTitle);
  if(!episodesData) return;

  const list = document.getElementById('episodeList');
  let html = '';
  
  episodesData.forEach((ep, index) => {
    html += `
      <div class="ep-item" onclick="playVideo('${esc(animeTitle)}', ${index})">
        <div>
          <div class="ep-name">${ep.name}</div>
          <div class="ep-sub"><span>🇹🇷 Türkçe Altyazı</span> <span>1080p</span></div>
        </div>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="#93c5fd"><path d="M8 5v14l11-7z"/></svg>
      </div>
    `;
  });
  
  list.innerHTML = html;
  document.getElementById('episodesModal').classList.add('show');
}

function closeEpisodes(){document.getElementById('episodesModal').classList.remove('show')}

// === 4. VİDEO OYNATMA (HLS DESTEKLİ) ===
let hls = null; // HLS instance'ını globalde tut

function playVideo(animeTitle, episodeIndex){
  const episodesData = findAnimeInDB(animeTitle);
  if(!episodesData || !episodesData[episodeIndex]) return;
  
  const episode = episodesData[episodeIndex];
  
  closeModal();
  closeEpisodes();
  
  localStorage.setItem('aniturk_history', animeTitle + " - " + episode.name);
  document.getElementById('userHistory').innerText = "Son izlenen: " + animeTitle + " - " + episode.name;

  document.getElementById('vTitle').innerText = animeTitle + " - " + episode.name;
  const video = document.getElementById('mainVideo');
  
  // Eski HLS instance'ını temizle
  if (hls) {
    hls.destroy();
    hls = null;
  }
  
  video.pause();
  video.innerHTML = '';
  video.removeAttribute('src');

  // Altyazı varsa ekle
  if (episode.subtitle && episode.subtitle.trim() !== "") {
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = 'Türkçe';
    track.srclang = 'tr';
    track.src = episode.subtitle;
    track.default = true;
    video.appendChild(track);
  }
  
  const videoUrl = episode.url;

  // Eğer link .m3u8 ile bitiyorsa HLS.js kullan
  if (videoUrl.includes('.m3u8')) {
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(videoUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari gibi native HLS destekleyen tarayıcılar için
      video.src = videoUrl;
      video.addEventListener('loadedmetadata', function() {
        video.play();
      });
    } else {
      alert('Tarayıcınız bu video formatını desteklemiyor.');
    }
  } else {
    // MP4 ise doğrudan oynat
    video.src = videoUrl;
    video.load();
    video.play();
  }
  
  document.getElementById('videoPlayerModal').classList.add('show');
}

function closeVideo(){
  const video = document.getElementById('mainVideo');
  video.pause();
  if (hls) {
    hls.destroy();
    hls = null;
  }
  video.innerHTML = '';
  video.removeAttribute('src');
  document.getElementById('videoPlayerModal').classList.remove('show');
}
</script>
</body>
</html>
