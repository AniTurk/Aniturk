<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f16">
<title>AniTürk — Anime İzle</title>
<style>
html, body { max-width: 100vw; overflow-x: hidden !important; margin: 0; padding: 0; }
* { box-sizing: border-box; }
:root{ --bg:#0b0f16;--surface:#121925;--line:#273449;--txt:#e5ebf4;--muted:#9aa9bd;--primary:#3b82f6; }
body{background:var(--bg);color:var(--txt);font:15px/1.5 Inter,sans-serif;-webkit-font-smoothing:antialiased;}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}

/* GİRİŞ EKRANI */
#loginScreen{position:fixed;inset:0;background:#0b0f16;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px;width:100%;max-width:400px;}
.login-box h2{text-align:center;margin-top:0;font-size:24px;color:var(--primary)}
.input-group{margin-bottom:15px}
.input-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.input-group input{width:100%;background:#151e2b;border:1px solid var(--line);border-radius:6px;padding:12px;color:white;outline:none}
.pass-strength{height:4px;background:#333;border-radius:2px;margin-top:5px;width:0%}
.btn-login{width:100%;background:var(--primary);color:white;border:0;border-radius:6px;padding:14px;font-weight:bold;font-size:16px;margin-top:10px;}

/* ANA UYGULAMA */
.topbar{height:72px;position:sticky;top:0;z-index:20;background:#0d131d;border-bottom:1px solid var(--line)}
.nav{max-width:1480px;height:100%;margin:auto;padding:0 28px;display:flex;align-items:center;gap:30px}
.brand{display:inline-flex;align-items:center;gap:10px;color:#d5deeb;font-size:23px;font-weight:850}
.brand-mark{width:31px;height:31px;display:grid;place-items:center;border-radius:9px;color:#eaf2ff;font-size:17px;font-weight:900;background:linear-gradient(145deg,#45658f,#243b5c);}
.wrap{max-width:1480px;margin:auto;padding:28px 28px 100px}
.catalog-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:23px 16px}
.anime-card{cursor:pointer}
.cover{width:100%;height:270px;object-fit:cover;border-radius:6px;background:#171723;}
.anime-card h3{font-size:14px;margin:9px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; color: #fff;}
.subline{color:#aaa;font-size:11px}

/* MODAL VE OYNATICI */
.modal{position:fixed;inset:0;z-index:50;background:#000c;display:none;place-items:center;padding:16px;backdrop-filter:blur(10px);}
.modal.show{display:grid;}
.dialog{width:100%;max-width:850px;max-height:90vh;overflow-y:auto;background:#0f1521;border:1px solid #34445b;border-radius:12px;position:relative;}
.dialog-header{padding:16px 24px;background:#0f1521;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center; position: sticky; top: 0; z-index: 10; border-radius: 12px 12px 0 0;}
.dialog-header h3{margin:0;font-size:16px; color: #fff;}
.close-btn{background:#ef4444;color:white;border:none;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer;}
.video-container{position:relative;width:100%;padding-top:56.25%;background:#000;}
.video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

/* BÖLÜM LİSTESİ */
.episode-list{padding:20px;display:flex;flex-direction:column;gap:10px; max-height: 60vh; overflow-y: auto;}
.ep-item{background:#151e2b;border:1px solid #273449;padding:14px 16px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer; transition: 0.2s;}
.ep-item:hover{border-color:var(--primary);background:#172233;}
.ep-name{font-weight:600;font-size:15px; color: #e5ebf4;}

@media(max-width:1000px){.catalog-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:650px){
 .topbar{height:60px}.nav{padding:0 15px}.brand{font-size:21px}
 .wrap{padding:17px 14px 90px}.catalog-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .dialog-header{flex-wrap:wrap;gap:10px;}
}
</style>
</head>
<body>

<!-- GİRİŞ EKRANI -->
<div id="loginScreen">
  <div class="login-box">
    <h2>AniTürk'e Hoş Geldin</h2>
    <div class="input-group">
      <label>Kullanıcı Adın</label>
      <input type="text" id="regName" placeholder="İsmini yaz...">
    </div>
    <div class="input-group">
      <label>Şifre</label>
      <input type="password" id="regPass" placeholder="Güçlü bir şifre belirle..." oninput="checkStrength()">
      <div class="pass-strength" id="passBar"></div>
      <div id="passText" style="font-size:11px;margin-top:3px;color:var(--muted)"></div>
    </div>
    <div class="input-group">
      <label>Şifreyi Onayla</label>
      <input type="password" id="regPassConfirm" placeholder="Şifreni tekrar gir...">
    </div>
    <button class="btn-login" onclick="registerUser()">Kayıt Ol ve Giriş Yap</button>
  </div>
</div>

<!-- ANA UYGULAMA -->
<div id="mainApp" style="display:none;">
  <header class="topbar"><nav class="nav"><a class="brand" href="#"><span class="brand-mark">A</span><span>AniTürk</span></a></nav></header>
  <main class="wrap">
    <div class="catalog-grid" id="catalogGrid"></div>
  </main>
</div>

<!-- MODAL (Bölüm Listesi ve Video Oynatıcı) -->
<div class="modal" id="videoPlayerModal" onclick="if(event.target===this)closeVideo()">
 <div class="dialog">
  <div class="dialog-header">
   <h3 id="vTitle">Anime Adı</h3>
   <button class="close-btn" onclick="closeVideo()">Kapat ✕</button>
  </div>
  <div id="videoContainer">
    <!-- İçerik dinamik olarak eklenecek -->
  </div>
 </div>
</div>

<script>
// === GİRİŞ SİSTEMİ ===
function checkStrength() {
  const pass = document.getElementById('regPass').value;
  const bar = document.getElementById('passBar');
  const text = document.getElementById('passText');
  let strength = 0;
  if (pass.length >= 5) strength++;
  if (pass.length >= 8) strength++;
  if (/[A-Z]/.test(pass)) strength++;
  if (/[0-9]/.test(pass)) strength++;
  if (/[^A-Za-z0-9]/.test(pass)) strength++;
  if (pass.length === 0) { bar.style.width = '0%'; text.innerText = ''; }
  else if (strength <= 2) { bar.style.width = '33%'; bar.style.background = '#ef4444'; text.innerText = 'Zayıf (Kabul Edilmez)'; text.style.color = '#ef4444'; }
  else if (strength <= 4) { bar.style.width = '66%'; bar.style.background = '#eab308'; text.innerText = 'Normal'; text.style.color = '#eab308'; }
  else { bar.style.width = '100%'; bar.style.background = '#22c55e'; text.innerText = 'Güçlü (Mükemmel)'; text.style.color = '#22c55e'; }
}
function registerUser() {
  const name = document.getElementById('regName').value.trim();
  const pass = document.getElementById('regPass').value;
  const confirm = document.getElementById('regPassConfirm').value;
  if (name.length < 3) return alert('İsmin en az 3 harf olmalı.');
  if (pass.length < 5) return alert('Şifren çok zayıf!');
  if (pass !== confirm) return alert('Şifreler uyuşmuyor!');
  localStorage.setItem('aniturk_user', name);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  initApp();
}
window.onload = () => {
  if (localStorage.getItem('aniturk_user')) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    initApp();
  }
};

// === ANİME VERİLERİ ===
const animeDB = {
  "Attack on Titan": { anilistId: 16498, totalEpisodes: 25, imageUrl: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx16498-C6FPmWm59CyP.jpg" },
  "One Piece": { anilistId: 21, totalEpisodes: 1000, imageUrl: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21-ELWl3xN7xN7x.jpg" },
  "Jujutsu Kaisen": { anilistId: 113415, totalEpisodes: 24, imageUrl: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx113415-9yG7h4yWjKqM.jpg" },
  "Demon Slayer": { anilistId: 101922, totalEpisodes: 26, imageUrl: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx101922-9yG7h4yWjKqM.jpg" },
  "My Hero Academia": { anilistId: 21459, totalEpisodes: 13, imageUrl: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21459-9yG7h4yWjKqM.jpg" }
};

function initApp() {
  const grid = document.getElementById('catalogGrid');
  let html = '';
  for (let key in animeDB) {
    const anime = animeDB[key];
    // Görselleri proxy üzerinden yüklüyoruz (CORS ve engellemeleri aşmak için)
    const proxiedImage = `https://images.weserv.nl/?url=${encodeURIComponent(anime.imageUrl)}`;
    html += `
      <article class="anime-card" onclick="openAnime('${key}')">
        <img class="cover" src="${proxiedImage}" alt="${key}" onerror="this.src='https://via.placeholder.com/300x400/121925/3b82f6?text=AniT%C3%BCrk'">
        <h3>${key}</h3>
        <div class="subline">${anime.totalEpisodes} Bölüm</div>
      </article>
    `;
  }
  grid.innerHTML = html;
}

function openAnime(animeTitle) {
  const anime = animeDB[animeTitle];
  if (!anime) return;

  let html = '<div class="episode-list">';
  for (let i = 1; i <= anime.totalEpisodes; i++) {
    html += `
      <div class="ep-item" onclick="playEpisode('${animeTitle}', ${i})">
        <div class="ep-name">${i}. Bölüm</div>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="#3b82f6"><path d="M8 5v14l11-7z"/></svg>
      </div>
    `;
  }
  html += '</div>';

  const modal = document.getElementById('videoPlayerModal');
  document.getElementById('vTitle').innerText = animeTitle + " - Bölümler";
  document.getElementById('videoContainer').innerHTML = html;
  modal.classList.add('show');
}

// === MEGAPLAY IFRAME İLE VİDEO OYNATMA ===
function playEpisode(animeTitle, episodeNumber) {
  const anime = animeDB[animeTitle];
  if (!anime) return;

  document.getElementById('vTitle').innerText = animeTitle + " - " + episodeNumber + ". Bölüm";
  
  const container = document.getElementById('videoContainer');
  
  // MegaPlay iframe URL'si (AniList ID ile)
  const iframeUrl = `https://megaplay.buzz/stream/ani/${anime.anilistId}/${episodeNumber}/sub`;
  
  container.innerHTML = `
    <div class="video-container">
      <iframe 
        src="${iframeUrl}" 
        allow="autoplay; fullscreen; encrypted-media" 
        allowfullscreen>
      </iframe>
    </div>
  `;
}

function closeVideo() {
  document.getElementById('videoContainer').innerHTML = '';
  document.getElementById('videoPlayerModal').classList.remove('show');
}
</script>
</body>
</html>
